meta:
  name: brand.yml
  link: https://posit-dev.github.io/brand-yml

logo: logos/icon/brand-yml-icon-color.svg

color:
  palette:
    black: "#1A1A1A"
    white: "#EEEEEE"
    red: "#DD796F"
    gray: "#595959"
  foreground: black
  background: white
  primary: red
  secondary: gray
  danger: pink

typography:
  fonts:
    - family: Fira Sans
      source: google
    - family: Rubik
      source: google
    - family: IBM Plex Mono
      source: google

  base:
    family: Fira Sans
    color: secondary
  headings:
    family: Fira Sans
    weight: 700
    color: secondary
  monospace: IBM Plex Mono